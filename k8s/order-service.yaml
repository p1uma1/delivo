apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: delivo
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: delivoregistry123.azurecr.io/order-service:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: delivo-config
            - secretRef:
                name: delivo-secrets
          env:
            - name: PORT
              value: "3002"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: delivo
spec:
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002
