apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: delivo
  labels:
    app: delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: delivoregistry123.azurecr.io/delivery-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: delivo-config
            - secretRef:
                name: delivo-secrets
          env:
            - name: PORT
              value: "3003"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: delivo
spec:
  selector:
    app: delivery-service
  ports:
    - port: 3003
      targetPort: 3003
