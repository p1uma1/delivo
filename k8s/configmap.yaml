apiVersion: v1
kind: ConfigMap
metadata:
  name: delivo-config
  namespace: delivo
data:
  NODE_ENV: "production"
  CORS_ORIGIN: "https://delivo.40.65.171.126.nip.io"
  RABBITMQ_EXCHANGE: "delivo.events"

  # ── Service Ports ──────────────────────────────────────────────────────────
  # Using generic names to avoid K8s service env var collisions
  # (K8s injects SERVICE_NAME_PORT=tcp://... automatically)
  APP_PORT_API: "3000"
  APP_PORT_USER: "3001"
  APP_PORT_ORDER: "3002"
  APP_PORT_DELIVERY: "3003"
  APP_PORT_PRODUCT: "3004"
  APP_PORT_CART: "3005"
  APP_PORT_NOTIFICATION: "3006"

  # ── Internal Service URLs (K8s service names — same as Docker Compose) ────
  USER_SERVICE_URL: "http://user-service.delivo.svc.cluster.local:3001"
  ORDER_SERVICE_URL: "http://order-service.delivo.svc.cluster.local:3002"
  DELIVERY_SERVICE_URL: "http://delivery-service.delivo.svc.cluster.local:3003"
  PRODUCT_SERVICE_URL: "http://product-service.delivo.svc.cluster.local:3004"
  CART_SERVICE_URL: "http://cart-service.delivo.svc.cluster.local:3005"
  NOTIFICATION_SOCKET_URL: "http://notification-service.delivo.svc.cluster.local:3006"

  # ── Token Expiry ───────────────────────────────────────────────────────────
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
