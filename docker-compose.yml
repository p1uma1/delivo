version: '3.9'

networks:
  delivo-network:
    driver: bridge

volumes:
  rabbitmq-data:
  postgres-data:

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: delivo-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - delivo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: delivo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - delivo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    container_name: delivo-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    env_file: .env
    environment:
      PORT: 3000
    depends_on:
      - user-service
      - order-service
      - delivery-service
      - payment-service
      - product-service
      - admin-service
    networks:
      - delivo-network

  user-service:
    build:
      context: .
      dockerfile: backend/services/user-service/Dockerfile
    container_name: delivo-user-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivo
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - delivo-network

  order-service:
    build:
      context: .
      dockerfile: backend/services/order-service/Dockerfile
    container_name: delivo-order-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivo
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - delivo-network

  delivery-service:
    build:
      context: .
      dockerfile: backend/services/delivery-service/Dockerfile
    container_name: delivo-delivery-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivo
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - delivo-network

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    container_name: delivo-notification-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - delivo-network

  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile
    container_name: delivo-payment-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - delivo-network

  product-service:
    build:
      context: .
      dockerfile: backend/services/product-service/Dockerfile
    container_name: delivo-product-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - delivo-network

  admin-service:
    build:
      context: .
      dockerfile: backend/services/admin-service/Dockerfile
    container_name: delivo-admin-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivo
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - delivo-network

  # ─── Frontend ───────────────────────────────────────────────────────────────

  web-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: delivo-web-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      VITE_API_URL: http://api-gateway:3000
    depends_on:
      - api-gateway
    networks:
      - delivo-network
