version: '3.9'

networks:
  delivo-network:
    driver: bridge

volumes:
  rabbitmq-data:

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: delivo-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - delivo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Application Services ────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: delivo-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    env_file: .env
    environment:
      PORT: 3000
    depends_on:
      - user-service
      - order-service
      - delivery-service
    networks:
      - delivo-network

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: delivo-user-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - delivo-network

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: delivo-order-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3002
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - delivo-network

  delivery-service:
    build:
      context: .
      dockerfile: apps/delivery-service/Dockerfile
    container_name: delivo-delivery-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3003
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - delivo-network

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: delivo-notification-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - delivo-network

  # ─── Frontend ───────────────────────────────────────────────────────────────

  web-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: delivo-web-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      - api-gateway
    networks:
      - delivo-network
