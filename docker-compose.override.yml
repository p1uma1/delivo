# Docker Compose override for local development
# Enables hot-reload and exposes internal service ports for direct access

version: '3.9'

services:
  api-gateway:
    build:
      target: dev
    command: npm run dev
    volumes:
      - ./backend/api-gateway/src:/app/backend/api-gateway/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  user-service:
    build:
      target: dev
    command: npm run dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend/services/user-service/src:/app/backend/services/user-service/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  order-service:
    build:
      target: dev
    command: npm run dev
    ports:
      - "3002:3002"
    volumes:
      - ./backend/services/order-service/src:/app/backend/services/order-service/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  delivery-service:
    build:
      target: dev
    command: npm run dev
    ports:
      - "3003:3003"
    volumes:
      - ./backend/services/delivery-service/src:/app/backend/services/delivery-service/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  notification-service:
    build:
      target: dev
    command: npm run dev
    volumes:
      - ./backend/services/notification-service/src:/app/backend/services/notification-service/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  product-service:
    build:
      target: dev
    command: npm run dev
    ports:
      - "3005:3005"
    volumes:
      - ./backend/services/product-service/src:/app/backend/services/product-service/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  admin-service:
    build:
      target: dev
    command: npm run dev
    ports:
      - "3006:3006"
    volumes:
      - ./backend/services/admin-service/src:/app/backend/services/admin-service/src
      - ./backend/packages/shared/src:/app/backend/packages/shared/src

  web-app:
    build:
      target: dev
    command: npm run dev
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
