name: CI/CD — Build, Push & Deploy to AKS

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

env:
  K8S_NAMESPACE: delivo

jobs:
  # ─── Build & Push Docker Images ───────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to ACR
    runs-on: ubuntu-latest
    # On PRs, still build (but don't push) to catch Dockerfile errors early
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Backend Services ──────────────────────────────────────────────────────

      - name: Build & Push — api-gateway
        run: |
          docker build --target production \
            -f backend/api-gateway/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/api-gateway:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/api-gateway:latest \
            .
          ${{ github.event_name == 'push' && 'docker push ${{ secrets.ACR_REGISTRY }}/api-gateway:${{ github.sha }} && docker push ${{ secrets.ACR_REGISTRY }}/api-gateway:latest' || 'echo "PR build — skipping push"' }}

      - name: Build & Push — user-service
        run: |
          docker build --target production \
            -f backend/services/user-service/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/user-service:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/user-service:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/user-service:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/user-service:latest
          fi

      - name: Build & Push — order-service
        run: |
          docker build --target production \
            -f backend/services/order-service/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/order-service:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/order-service:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/order-service:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/order-service:latest
          fi

      - name: Build & Push — delivery-service
        run: |
          docker build --target production \
            -f backend/services/delivery-service/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/delivery-service:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/delivery-service:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/delivery-service:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/delivery-service:latest
          fi

      - name: Build & Push — product-service
        run: |
          docker build --target production \
            -f backend/services/product-service/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/product-service:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/product-service:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/product-service:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/product-service:latest
          fi

      - name: Build & Push — cart-service
        run: |
          docker build --target production \
            -f backend/services/cart-service/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/cart-service:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/cart-service:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/cart-service:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/cart-service:latest
          fi

      - name: Build & Push — notification-service
        run: |
          docker build --target production \
            -f backend/services/notification-service/Dockerfile \
            -t ${{ secrets.ACR_REGISTRY }}/notification-service:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/notification-service:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/notification-service:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/notification-service:latest
          fi

      # ── Frontend — VITE_* vars baked in at build time ─────────────────────────

      - name: Build & Push — web-app
        run: |
          docker build --target production \
            -f apps/web/Dockerfile \
            --build-arg VITE_API_URL=https://api.${{ secrets.APP_DOMAIN }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --build-arg VITE_NOTIFICATION_SOCKET_URL=wss://ws.${{ secrets.APP_DOMAIN }} \
            -t ${{ secrets.ACR_REGISTRY }}/web-app:${{ github.sha }} \
            -t ${{ secrets.ACR_REGISTRY }}/web-app:latest \
            .
          if [ "${{ github.event_name }}" = "push" ]; then
            docker push ${{ secrets.ACR_REGISTRY }}/web-app:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/web-app:latest
          fi

  # ─── Deploy to AKS ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

      # Create/update the K8s Secret from GitHub Secrets (idempotent)
      - name: Sync application secrets to K8s
        run: |
          kubectl create secret generic delivo-secrets \
            --namespace=$K8S_NAMESPACE \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}" \
            --from-literal=JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=RABBITMQ_URL="amqp://guest:guest@rabbitmq:5672" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Apply infrastructure manifests (namespace, configmap, ingress, services)
      - name: Apply K8s manifests
        run: kubectl apply -f k8s/ --recursive --namespace=$K8S_NAMESPACE

      # Rolling update — swap image to the new SHA tag
      - name: Update image tags
        env:
          ACR: ${{ secrets.ACR_REGISTRY }}
          TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/api-gateway         api-gateway=$ACR/api-gateway:$TAG             -n $K8S_NAMESPACE
          kubectl set image deployment/user-service        user-service=$ACR/user-service:$TAG            -n $K8S_NAMESPACE
          kubectl set image deployment/order-service       order-service=$ACR/order-service:$TAG          -n $K8S_NAMESPACE
          kubectl set image deployment/delivery-service    delivery-service=$ACR/delivery-service:$TAG    -n $K8S_NAMESPACE
          kubectl set image deployment/product-service     product-service=$ACR/product-service:$TAG      -n $K8S_NAMESPACE
          kubectl set image deployment/cart-service        cart-service=$ACR/cart-service:$TAG            -n $K8S_NAMESPACE
          kubectl set image deployment/notification-service notification-service=$ACR/notification-service:$TAG -n $K8S_NAMESPACE
          kubectl set image deployment/web-app             web-app=$ACR/web-app:$TAG                      -n $K8S_NAMESPACE

      # Wait for all deployments to finish rolling out
      - name: Verify rollout
        run: |
          for deployment in api-gateway user-service order-service delivery-service product-service cart-service notification-service web-app; do
            echo "Waiting for $deployment..."
            kubectl rollout status deployment/$deployment -n $K8S_NAMESPACE --timeout=5m
          done
          echo "All deployments rolled out successfully ✓"
